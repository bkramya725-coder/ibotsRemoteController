<script>
    (() => {
      const cards = document.querySelectorAll('.switch-card');
      
      cards.forEach((card) => {
        card.addEventListener('click', () => {
          const isCurrentlyOn = card.getAttribute('data-checked') === 'true';
          const nextState = !isCurrentlyOn;
          
          card.setAttribute('data-checked', String(nextState));
          
          const track = card.querySelector('.toggle-track');
          const thumb = card.querySelector('.toggle-thumb');
          const indicator = card.querySelector('.status-indicator');
          
          if (nextState) {
            track.classList.remove('bg-surface-container-highest');
            track.classList.add('bg-[#0d9488]');
            
            thumb.classList.remove('translate-x-0');
            thumb.classList.add('translate-x-5');
            
            indicator.textContent = 'ON';
            indicator.classList.remove('text-on-surface-variant');
            indicator.classList.add('text-[#0d9488]');
          } else {
            track.classList.remove('bg-[#0d9488]');
            track.classList.add('bg-surface-container-highest');
            
            thumb.classList.remove('translate-x-5');
            thumb.classList.add('translate-x-0');
            
            indicator.textContent = 'OFF';
            indicator.classList.remove('text-[#0d9488]');
            indicator.classList.add('text-on-surface-variant');
          }
        });
      });
    })();
  </script>
