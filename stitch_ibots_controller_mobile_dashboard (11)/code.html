
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="shell-type" content="mobile_tab">
  <title>Help &amp; Support - iBots</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:ital,wght@0,600;0,700;1,400&family=Public+Sans:wght@500;600;700&display=swap"
    rel="stylesheet">

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "secondary-fixed": "#dfe3e8",
            "on-secondary-fixed": "#171c20",
            "on-surface-variant": "#434653",
            "surface-container-lowest": "#ffffff",
            "surface-container-highest": "#e3e2e3",
            "on-primary-container": "#e7ebff",
            "surface-variant": "#e3e2e3",
            "surface-tint": "#2259bf",
            "on-primary-fixed": "#001946",
            "surface-container-low": "#f5f3f4",
            "tertiary-fixed": "#f9e37a",
            "outline-variant": "#c3c6d5",
            "surface-bright": "#faf9fa",
            "on-background": "#1b1c1d",
            "error-container": "#ffdad6",
            "on-primary": "#ffffff",
            "on-tertiary": "#ffffff",
            "secondary": "#5a5f63",
            "on-secondary": "#ffffff",
            "inverse-primary": "#b1c5ff",
            "on-secondary-container": "#606569",
            "on-surface": "#1b1c1d",
            "tertiary-fixed-dim": "#dcc661",
            "tertiary-container": "#bfab49",
            "surface-container-high": "#e9e8e9",
            "primary-fixed-dim": "#b1c5ff",
            "surface-container": "#efedee",
            "primary-container": "#3366cc",
            "primary-fixed": "#d9e2ff",
            "surface-dim": "#dbdadb",
            "on-secondary-fixed-variant": "#42474b",
            "on-tertiary-fixed-variant": "#524600",
            "on-primary-fixed-variant": "#00419d",
            "primary": "#094cb2",
            "inverse-surface": "#303031",
            "outline": "#737784",
            "on-error-container": "#93000a",
            "on-tertiary-fixed": "#211b00",
            "surface": "#faf9fa",
            "error": "#ba1a1a",
            "tertiary": "#6d5e00",
            "on-error": "#ffffff",
            "inverse-on-surface": "#f2f0f1",
            "secondary-container": "#dfe3e8",
            "background": "#faf9fa",
            "on-tertiary-container": "#4a3f00",
            "secondary-fixed-dim": "#c2c7cc"
          },
          borderRadius: {
            DEFAULT: "0.125rem",
            lg: "0.25rem",
            xl: "0.5rem",
            full: "0.75rem"
          },
          fontFamily: {
            headline: ["Noto Serif", "serif"],
            display: ["Noto Serif", "serif"],
            body: ["Inter", "sans-serif"],
            label: ["Public Sans", "sans-serif"]
          }
        }
      }
    };
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      overscroll-behavior: none;
    }

    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .pt-safe {
      padding-top: env(safe-area-inset-top, 0px);
    }

    main > :first-child {
      margin-top: 0 !important;
    }

    main > :last-child {
      margin-bottom: 0 !important;
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

<body class="bg-surface font-body text-on-surface flex flex-col min-h-screen">

  <!-- HEADER -->
  <header
    class="fixed top-0 inset-x-0 z-40 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]">

    <div class="h-16 px-4 flex items-center justify-between">

      <div class="flex items-center gap-1">
        <button
          aria-label="Go back"
          type="button"
          class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high active:bg-surface-container transition-colors"
          onclick="goBack()">

          <span class="material-symbols-outlined text-[24px]">
            arrow_back
          </span>
        </button>

        <h1 class="text-lg font-headline font-semibold text-on-surface tracking-tight leading-tight pl-1">
          Help &amp; Support
        </h1>
      </div>

      <div class="flex items-center">
        <a
          aria-label="Profile"
          class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors"
          data-path="user-profile"
          href="#">

          <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center">
            <span class="material-symbols-outlined text-on-primary text-[18px]">
              person
            </span>
          </div>
        </a>
      </div>

    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex flex-col relative w-full pt-16 pb-24 bg-surface">

    <div class="flex flex-col w-full">

      <div class="mx-4 mt-4 bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden flex flex-col">

        <!-- USER GUIDE -->
        <button
          class="w-full text-left p-4 flex items-center justify-between transition-colors bg-surface-container-lowest hover:bg-surface-container-low active:bg-surface-container cursor-pointer outline-none"
          onclick="showHelpModal('User Guide', 'Explore comprehensive documentation, assembly guides, motor calibration steps, and pinout diagrams tailored for your iBots hardware modules.')"
          type="button">

          <div class="flex items-center min-w-0 pr-2">

            <div class="w-12 h-12 rounded-lg bg-primary-fixed text-primary flex items-center justify-center shrink-0 mr-3.5">
              <span class="material-symbols-outlined text-[24px]">
                menu_book
              </span>
            </div>

            <div class="flex flex-col min-w-0">
              <span class="font-headline font-semibold text-on-surface text-base tracking-tight truncate">
                User Guide
              </span>

              <span class="font-body text-xs text-on-surface-variant mt-0.5 line-clamp-1">
                Learn how to operate and configure iBots controls
              </span>
            </div>

          </div>

          <span class="material-symbols-outlined text-outline-variant shrink-0 text-[20px]">
            chevron_right
          </span>
        </button>

        <!-- DIVIDER -->
        <div class="h-[1px] w-full bg-surface-container"></div>

        <!-- CONTACT SUPPORT -->
        <button
          class="w-full text-left p-4 flex items-center justify-between transition-colors bg-surface-container-lowest hover:bg-surface-container-low active:bg-surface-container cursor-pointer outline-none"
          onclick="showHelpModal('Contact Support', 'Submit telemetry logs directly to our embedded systems specialists or open a dedicated priority support ticket.')"
          type="button">

          <div class="flex items-center min-w-0 pr-2">

            <div class="w-12 h-12 rounded-lg bg-primary-fixed text-primary flex items-center justify-center shrink-0 mr-3.5">
              <span class="material-symbols-outlined text-[24px]">
                support_agent
              </span>
            </div>

            <div class="flex flex-col min-w-0">

              <span class="font-headline font-semibold text-on-surface text-base tracking-tight truncate">
                Contact Support
              </span>

              <span class="font-body text-xs text-on-surface-variant mt-0.5 line-clamp-1">
                Get direct assistance from our engineering team
              </span>

            </div>
          </div>

          <span class="material-symbols-outlined text-outline-variant shrink-0 text-[20px]">
            chevron_right
          </span>
        </button>

      </div>
    </div>

    <!-- HELP MODAL -->
    <div
      id="helpModal"
      class="fixed inset-0 z-50 bg-on-surface/30 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity duration-200 opacity-0"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle">

      <div
        id="modalContent"
        class="w-full max-w-sm bg-surface-container-lowest rounded-t-xl sm:rounded-xl p-6 shadow-xl transform transition-transform duration-200 translate-y-6 sm:translate-y-0">

        <div class="w-10 h-1 bg-surface-container-high rounded-full mx-auto mb-4 sm:hidden"></div>

        <div class="flex items-center gap-3 mb-3">

          <div class="w-10 h-10 rounded-lg bg-primary-fixed text-primary flex items-center justify-center shrink-0">

            <span
              class="material-symbols-outlined text-[22px]"
              id="modalIcon">
              info
            </span>

          </div>

          <h3
            class="font-headline font-semibold text-lg text-on-surface tracking-tight"
            id="modalTitle">
          </h3>

        </div>

        <p
          class="font-body text-sm text-on-surface-variant leading-relaxed mb-6"
          id="modalDesc">
        </p>

        <div class="flex gap-2">
          <button
            class="w-full py-2.5 px-4 rounded-lg bg-gradient-to-r from-primary to-primary-container text-on-primary font-label text-sm font-semibold tracking-wide hover:opacity-95 active:scale-[0.98] transition-all"
            onclick="closeHelpModal()"
            type="button">
            Dismiss
          </button>
        </div>

      </div>
    </div>

  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav
    class="fixed bottom-0 inset-x-0 z-40 pb-safe bg-surface/80 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]"
    data-active-classes="text-primary font-semibold">

    <div class="flex justify-around items-center h-16 px-2">

      <a class="flex flex-col items-center justify-center gap-1 w-16 h-12 text-on-surface-variant hover:text-on-surface transition-colors"
         data-path="home" href="#">
        <span class="material-symbols-outlined text-[22px]">home</span>
        <span class="text-[11px] font-label leading-none">Home</span>
      </a>

      <a class="flex flex-col items-center justify-center gap-1 w-16 h-12 text-on-surface-variant hover:text-on-surface transition-colors"
         data-path="devices" href="#">
        <span class="material-symbols-outlined text-[22px]">precision_manufacturing</span>
        <span class="text-[11px] font-label leading-none">Devices</span>
      </a>

      <a class="flex flex-col items-center justify-center gap-1 w-16 h-12 text-on-surface-variant hover:text-on-surface transition-colors"
         data-path="code" href="#">
        <span class="material-symbols-outlined text-[22px]">terminal</span>
        <span class="text-[11px] font-label leading-none">Code</span>
      </a>

      <a class="flex flex-col items-center justify-center gap-1 w-16 h-12 text-on-surface-variant hover:text-on-surface transition-colors"
         data-path="settings" href="#">
        <span class="material-symbols-outlined text-[22px]">settings</span>
        <span class="text-[11px] font-label leading-none">Settings</span>
      </a>

    </div>
  </nav>

  <!-- JAVASCRIPT -->
  <script>
    let closeTimer = null;

    function showHelpModal(title, description) {
      const modal = document.getElementById("helpModal");
      const content = document.getElementById("modalContent");
      const titleEl = document.getElementById("modalTitle");
      const descEl = document.getElementById("modalDesc");
      const iconEl = document.getElementById("modalIcon");

      clearTimeout(closeTimer);

      titleEl.textContent = title;
      descEl.textContent = description;

      if (title.includes("Guide")) {
        iconEl.textContent = "menu_book";
      } else if (title.includes("FAQ")) {
        iconEl.textContent = "help_outline";
      } else if (title.includes("Connection")) {
        iconEl.textContent = "bluetooth_searching";
      } else if (title.includes("Feature")) {
        iconEl.textContent = "widgets";
      } else {
        iconEl.textContent = "support_agent";
      }

      modal.classList.remove("hidden");
      modal.classList.add("flex");

      requestAnimationFrame(() => {
        modal.classList.remove("opacity-0");
        content.classList.remove("translate-y-6");
      });
    }

    function closeHelpModal() {
      const modal = document.getElementById("helpModal");
      const content = document.getElementById("modalContent");

      modal.classList.add("opacity-0");
      content.classList.add("translate-y-6");

      clearTimeout(closeTimer);

      closeTimer = setTimeout(() => {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      }, 200);
    }

    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      }
    }

    document.getElementById("helpModal")
      .addEventListener("click", (event) => {
        if (event.target.id === "helpModal") {
          closeHelpModal();
        }
      });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeHelpModal();
      }
    });
  </script>

</body>
</html>
