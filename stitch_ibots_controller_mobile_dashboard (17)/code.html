<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Robotic Arm Control — iBots</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Phosphor Icons for consistent clean hardware/UI icons -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#0284c7',
              700: '#0369a1',
              dark: '#003580'
            }
          }
        }
      }
    }
  </script>
<style>
    /* Custom styled range slider thumb for consistent sleek mobile look */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]:focus {
      outline: none;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 8px;
      cursor: pointer;
      background: #e2e8f0;
      border-radius: 9999px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #0284c7;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -8px;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4), 0 0 0 2px #ffffff;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    input[type=range]:active::-webkit-slider-thumb {
      transform: scale(1.15);
      background: #0369a1;
    }
    input[type=range]::-moz-range-track {
      width: 100%;
      height: 8px;
      cursor: pointer;
      background: #e2e8f0;
      border-radius: 9999px;
    }
    input[type=range]::-moz-range-thumb {
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #0284c7;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4);
    }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-sky-100 selection:text-sky-800 pb-20">
<!-- Main Container (Mobile Portrait Framed View) -->
<div class="w-full max-w-md mx-auto flex flex-col min-h-screen bg-slate-50 shadow-sm relative">
<!-- Top App Bar / Header -->
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200/80 px-4 py-3.5 flex items-center justify-between">
<div class="flex items-center gap-3">
<button aria-label="Go Back" class="w-9 h-9 rounded-full flex items-center justify-center text-slate-600 hover:text-slate-900 hover:bg-slate-100 active:scale-95 transition-all" onclick="window.history.back()">
<i class="ph ph-arrow-left text-xl font-bold"></i>
</button>
<div>
<h1 class="text-lg font-bold text-slate-900 tracking-tight leading-tight">Robotic Arm Control</h1>
</div>
</div>
<!-- Quick Reset All Button -->
<button class="px-2.5 py-1 text-xs font-semibold text-slate-600 hover:text-sky-600 bg-slate-100 hover:bg-sky-50 rounded-lg border border-slate-200 transition-colors flex items-center gap-1 active:scale-95" onclick="resetAllServos()">
<i class="ph ph-arrow-counter-clockwise"></i>
<span>Center All</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 p-4 space-y-3.5">
<!-- Sliders Dynamic Container -->
<div class="space-y-3" id="slidersList">
<!-- Movement A Card (Fixed) -->
<div class="bg-white rounded-2xl p-4 border border-slate-200/90 shadow-sm hover:shadow-md transition-shadow" id="card-A">
<div class="flex items-center justify-between mb-3">
<div class="flex items-center gap-2.5">
<span class="w-8 h-8 rounded-xl bg-sky-50 text-sky-600 font-bold text-sm flex items-center justify-center border border-sky-100 shadow-inner">
                A
              </span>
<div>
<span class="text-sm font-bold text-slate-800">Movement A</span>
<span class="text-[11px] block text-slate-400 font-medium">Servo Base / Axis 1</span>
</div>
</div>
<div class="flex items-baseline gap-1 bg-slate-50 px-3 py-1 rounded-xl border border-slate-100">
<span class="text-lg font-black text-sky-600 font-mono tracking-tight" id="val-A">90</span>
<span class="text-xs font-semibold text-slate-500">°</span>
</div>
</div>
<div class="flex items-center gap-3">
<span class="text-xs font-medium text-slate-400 font-mono w-5">0°</span>
<div class="flex-1 relative">
<input class="w-full" id="slider-A" max="180" min="0" oninput="updateAngle('A', this.value)" type="range" value="90"/>
</div>
<span class="text-xs font-medium text-slate-400 font-mono w-7 text-right">180°</span>
</div>
</div>
<!-- Movement B Card (Fixed) -->
<div class="bg-white rounded-2xl p-4 border border-slate-200/90 shadow-sm hover:shadow-md transition-shadow" id="card-B">
<div class="flex items-center justify-between mb-3">
<div class="flex items-center gap-2.5">
<span class="w-8 h-8 rounded-xl bg-sky-50 text-sky-600 font-bold text-sm flex items-center justify-center border border-sky-100 shadow-inner">
                B
              </span>
<div>
<span class="text-sm font-bold text-slate-800">Movement B</span>
<span class="text-[11px] block text-slate-400 font-medium">Shoulder / Axis 2</span>
</div>
</div>
<div class="flex items-baseline gap-1 bg-slate-50 px-3 py-1 rounded-xl border border-slate-100">
<span class="text-lg font-black text-sky-600 font-mono tracking-tight" id="val-B">90</span>
<span class="text-xs font-semibold text-slate-500">°</span>
</div>
</div>
<div class="flex items-center gap-3">
<span class="text-xs font-medium text-slate-400 font-mono w-5">0°</span>
<div class="flex-1 relative">
<input class="w-full" id="slider-B" max="180" min="0" oninput="updateAngle('B', this.value)" type="range" value="90"/>
</div>
<span class="text-xs font-medium text-slate-400 font-mono w-7 text-right">180°</span>
</div>
</div>
<!-- Movement C Card (Fixed) -->
<div class="bg-white rounded-2xl p-4 border border-slate-200/90 shadow-sm hover:shadow-md transition-shadow" id="card-C">
<div class="flex items-center justify-between mb-3">
<div class="flex items-center gap-2.5">
<span class="w-8 h-8 rounded-xl bg-sky-50 text-sky-600 font-bold text-sm flex items-center justify-center border border-sky-100 shadow-inner">
                C
              </span>
<div>
<span class="text-sm font-bold text-slate-800">Movement C</span>
<span class="text-[11px] block text-slate-400 font-medium">Elbow / Axis 3</span>
</div>
</div>
<div class="flex items-baseline gap-1 bg-slate-50 px-3 py-1 rounded-xl border border-slate-100">
<span class="text-lg font-black text-sky-600 font-mono tracking-tight" id="val-C">90</span>
<span class="text-xs font-semibold text-slate-500">°</span>
</div>
</div>
<div class="flex items-center gap-3">
<span class="text-xs font-medium text-slate-400 font-mono w-5">0°</span>
<div class="flex-1 relative">
<input class="w-full" id="slider-C" max="180" min="0" oninput="updateAngle('C', this.value)" type="range" value="90"/>
</div>
<span class="text-xs font-medium text-slate-400 font-mono w-7 text-right">180°</span>
</div>
</div>
</div>
<!-- Add Movement Button -->
<div class="pt-2">
<button class="w-full py-3.5 px-4 bg-sky-500 hover:bg-sky-600 active:scale-[0.99] text-white font-semibold text-sm rounded-2xl shadow-sm hover:shadow transition-all flex items-center justify-center gap-2 border border-sky-400" id="addMovementBtn" onclick="addMovement()">
<i class="ph ph-plus-circle text-lg font-bold"></i>
<span>+ Add Movement</span>
</button>
</div>
</main>
<!-- Standard 4-Tab Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 px-6 py-2.5 flex items-center justify-between z-30 shadow-lg">
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-sky-600 transition-colors group" href="#">
<i class="ph ph-squares-four text-2xl group-hover:scale-105 transition-transform"></i>
<span class="text-[11px] font-semibold">Home</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-sky-600 transition-colors group" href="#">
<i class="ph ph-cpu text-2xl group-hover:scale-105 transition-transform"></i>
<span class="text-[11px] font-semibold">Devices</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-sky-600 transition-colors group" href="#">
<i class="ph ph-code text-2xl group-hover:scale-105 transition-transform"></i>
<span class="text-[11px] font-semibold">Code</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-sky-600 transition-colors group" href="#">
<i class="ph ph-sliders text-2xl group-hover:scale-105 transition-transform"></i>
<span class="text-[11px] font-semibold">Settings</span>
</a>
</nav>
</div>
<script>
    // Letters queue for sequential naming
    const availableLetters = 'DEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    let activeDynamicLetters = [];

    // Live angle update
    function updateAngle(letter, val) {
      const displayElem = document.getElementById(`val-${letter}`);
      if (displayElem) {
        displayElem.innerText = val;
      }
    }

    // Add new movement card
    function addMovement() {
      if (availableLetters.length === 0) {
        alert("Maximum number of movements reached (A-Z).");
        return;
      }

      const nextLetter = availableLetters.shift();
      activeDynamicLetters.push(nextLetter);

      const container = document.getElementById('slidersList');
      const card = document.createElement('div');
      card.id = `card-${nextLetter}`;
      card.className = "bg-white rounded-2xl p-4 border border-slate-200/90 shadow-sm hover:shadow-md transition-all animate-fade-in";
      card.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2.5">
            <span class="w-8 h-8 rounded-xl bg-sky-50 text-sky-600 font-bold text-sm flex items-center justify-center border border-sky-100 shadow-inner">
              ${nextLetter}
            </span>
            <div>
              <span class="text-sm font-bold text-slate-800">Movement ${nextLetter}</span>
              <span class="text-[11px] block text-slate-400 font-medium">Auxiliary Servo / Joint</span>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <div class="flex items-baseline gap-1 bg-slate-50 px-3 py-1 rounded-xl border border-slate-100">
              <span id="val-${nextLetter}" class="text-lg font-black text-sky-600 font-mono tracking-tight">90</span>
              <span class="text-xs font-semibold text-slate-500">°</span>
            </div>
            <!-- Remove Button for dynamic movement -->
            <button onclick="removeMovement('${nextLetter}')" class="w-8 h-8 rounded-lg flex items-center justify-center text-rose-400 hover:text-rose-600 hover:bg-rose-50 active:scale-95 transition-all" title="Remove Movement ${nextLetter}">
              <i class="ph ph-trash text-base"></i>
            </button>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-xs font-medium text-slate-400 font-mono w-5">0°</span>
          <div class="flex-1 relative">
            <input type="range" id="slider-${nextLetter}" min="0" max="180" value="90" oninput="updateAngle('${nextLetter}', this.value)" class="w-full">
          </div>
          <span class="text-xs font-medium text-slate-400 font-mono w-7 text-right">180°</span>
        </div>
      `;

      container.appendChild(card);

      // Smooth scroll to newly added card
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Remove added movement card (A, B, C are protected)
    function removeMovement(letter) {
      const card = document.getElementById(`card-${letter}`);
      if (card) {
        card.remove();
        // Remove from active list
        activeDynamicLetters = activeDynamicLetters.filter(l => l !== letter);
        // Put letter back and re-sort available letters
        availableLetters.push(letter);
        availableLetters.sort();
      }
    }

    // Center all sliders back to 90 degrees
    function resetAllServos() {
      const allLetters = ['A', 'B', 'C', ...activeDynamicLetters];
      allLetters.forEach(l => {
        const slider = document.getElementById(`slider-${l}`);
        if (slider) {
          slider.value = 90;
          updateAngle(l, 90);
        }
      });
    }
  </script>
</body>
</html>
